services:
  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: manager_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manager_demo"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
